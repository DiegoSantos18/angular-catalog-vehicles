<div class="v-modal-header">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <button mat-icon-button class="v-close-btn" (click)="onClose()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="v-modal-body">
  @if(data.message) {
    <p [innerHTML]="data.message"></p>
  }

  <ng-content></ng-content>
</mat-dialog-content>

<mat-dialog-actions align="end" class="v-modal-footer">
  <ng-content select="[footer-actions]"></ng-content>
</mat-dialog-actions>
